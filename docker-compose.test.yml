# Runs lint + the full test-suite inside Docker against a real MongoDB:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test
services:
  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      target: test
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI_TEST: mongodb://mongo:27017/clinic_test
