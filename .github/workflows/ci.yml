name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint & test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGO_URI_TEST: mongodb://localhost:27017/clinic_test
      MONGOMS_DISABLE_POSTINSTALL: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test            # fails if coverage drops below the thresholds in jest.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage
          retention-days: 7

  frontend:
    name: Frontend - lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker - build image & run tests inside it
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Run lint + tests inside Docker (with a real MongoDB)
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test
      - name: Build the production image
        run: docker build -t clinic-app .
      - name: Smoke test - the image starts and loads the app
        run: >
          docker run --rm
          -e JWT_SECRET=ci-secret -e JWT_REFRESH_SECRET=ci-refresh-secret -e MONGO_URI=mongodb://localhost/ci
          clinic-app node -e "require('./src/app'); console.log('app loads OK')"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set"; exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Wait for the app to be healthy
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          [ -z "$APP_URL" ] && { echo "APP_URL secret not set - skipping health check"; exit 0; }
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/api/health"; then echo; echo "Deployed and healthy"; exit 0; fi
            echo "waiting... ($i/30)"; sleep 10
          done
          echo "App did not become healthy"; exit 1
